<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17241f">
  <meta name="description" content="A quiet, distraction-free menu of favourite yoga sessions.">
  <title>Yoga</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317241f'/%3E%3Cpath d='M32 46c-11-8-16-17-13-29 7 2 12 7 13 14 2-9 7-14 15-16 2 15-4 25-15 31Z' fill='%23d8e56d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">YOUR QUIET CORNER</p>
        <h1>What do you need today?</h1>
      </div>
      <button class="random" id="randomButton" type="button" aria-label="Choose a yoga session for me">
        <span aria-hidden="true">↝</span> Choose for me
      </button>
    </header>

    <nav class="filters" aria-label="Filter sessions">
      <button class="filter active" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" type="button" data-filter="quick" aria-pressed="false">Under 20 min</button>
      <button class="filter" type="button" data-filter="longer" aria-pressed="false">20+ min</button>
    </nav>

    <section class="grid" id="videoGrid" aria-live="polite"></section>
  </main>

  <dialog id="playerDialog">
    <div class="dialog-bar">
      <p id="nowPlaying">Your session</p>
      <button id="closePlayer" class="close" type="button" aria-label="Close video">×</button>
    </div>
    <div class="player-wrap" id="playerWrap"></div>
  </dialog>

  <template id="videoCard">
    <article class="card">
      <button class="card-button" type="button">
        <span class="thumb-wrap">
          <img class="thumbnail" alt="" loading="lazy">
          <span class="play" aria-hidden="true">▶</span>
          <span class="duration"></span>
        </span>
        <span class="card-copy">
          <span class="number"></span>
          <span class="title">Yoga session</span>
          <span class="teacher">Tap to begin</span>
        </span>
      </button>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
